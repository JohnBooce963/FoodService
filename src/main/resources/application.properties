spring.application.name=mai_roo
# Hosts like Railway/Render pass the port in PORT.
server.port=${PORT:8080}

# Secrets come from the environment. For local dev, put them in a .env file next to pom.xml (gitignored, see .env.example).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}

# ponytail: Hibernate creates the missing order tables on startup and never drops anything.
# Move to Flyway once the schema needs real migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Errors go out as RFC 9457 problem JSON; the 400 reasons below land in "detail", 500s stay generic.
spring.mvc.problemdetails.enabled=true
